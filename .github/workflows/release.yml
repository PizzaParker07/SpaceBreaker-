name: Release

# Pushing a tag such as v0.1.0 builds the mod, runs the GameTests and publishes a GitHub Release
# with the jar attached. Release notes come from docs/releases/<tag>.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Spacebreaker ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: build/libs/*.jar
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
