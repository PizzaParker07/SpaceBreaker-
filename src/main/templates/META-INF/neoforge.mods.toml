modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/PizzaParker07/SpaceBreaker-/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/PizzaParker07/SpaceBreaker-"
logoFile = "spacebreaker_logo.png"
credits = "PizzaParker07 / Pizzaci Cocuk"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Planet engine: per-dimension solar time on other worlds
[[mixins]]
config = "spacebreaker.worldgen.mixins.json"

# Renderer compatibility: client weather in space worlds; shader-pack cloud fix (only applied with Iris installed)
[[mixins]]
config = "spacebreaker.compat.mixins.json"

# Optional renderers (never required; see docs/COMPAT.md)
[[dependencies.${mod_id}]]
modId = "iris"
type = "optional"
versionRange = "[1.8,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "[0.6,)"
ordering = "NONE"
side = "CLIENT"

# Access transformer (see the file for what it opens and why)
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
