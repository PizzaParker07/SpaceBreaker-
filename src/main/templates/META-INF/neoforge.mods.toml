modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/PizzaParker07/SpaceBreaker-/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/PizzaParker07/SpaceBreaker-"
logoFile = "spacebreaker_logo.png"
credits = "PizzaParker07 / Pizzacı Çocuk"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Planet engine: per-dimension solar time on other worlds
[[mixins]]
config = "spacebreaker.worldgen.mixins.json"

# Renderer compatibility: client weather in space worlds; shader-pack cloud fix (only applied with Iris installed)
[[mixins]]
config = "spacebreaker.compat.mixins.json"

# Optional renderers (never required; see docs/COMPAT.md)
[[dependencies.${mod_id}]]
modId = "iris"
type = "optional"
versionRange = "[1.8,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "optional"
versionRange = "[0.6,)"
ordering = "NONE"
side = "CLIENT"

# Optional recipe viewers and block info overlays (compat/jei, compat/emi, compat/jade, compat/wthit; never required).
# Their plugins are compiled against these API versions: older ones are refused with a clear message instead of a crash.
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "wthit"
type = "optional"
versionRange = "[12.0,)"
ordering = "NONE"
side = "CLIENT"
